{c:0,u:H+"9000/9060/",L:{
en:{t:"Section 504 Plans (Policy 9060)",s:"A legal plan that gives students with disabilities the accommodations they need to learn on equal footing.",m:"A 504 Plan comes from Section 504 of the Rehabilitation Act of 1973. It does not change what you learn; it changes how you get access to it. You qualify if a physical or mental impairment substantially limits something like learning, seeing, hearing, walking or breathing. A parent, teacher or staff member can ask for a 504 meeting, and a school team decides if you qualify. Unlike an IEP, a 504 Plan provides access, not specialized instruction.",e:["Extra time on tests","A seat near the teacher","Short breaks during class","Modified assignments","A student with severe allergies or diabetes has a written plan so teachers know how to help"],w:"Plans are written down and a case manager makes sure teachers follow them. Since July 2025, HCPSS also holds 504 meetings for students in grades 3, 6 and 9, which are transition years."},
es:{t:"Planes 504 (Política 9060)",s:"Un plan legal que da a los estudiantes con discapacidades los ajustes que necesitan para aprender en igualdad de condiciones.",m:"Un Plan 504 proviene de la Sección 504 de la Ley de Rehabilitación de 1973. No cambia lo que aprendes, sino cómo accedes a ello. Calificas si una discapacidad física o mental limita de forma importante actividades como aprender, ver, oír, caminar o respirar. Padres, maestros o personal pueden pedir una reunión 504 y un equipo escolar decide si calificas. A diferencia de un IEP, el Plan 504 da acceso, no instrucción especializada.",e:["Más tiempo en los exámenes","Sentarte cerca del maestro","Descansos cortos en clase","Tareas modificadas","Un estudiante con alergias graves o diabetes tiene un plan escrito para que los maestros sepan cómo ayudar"],w:"Los planes se ponen por escrito y un gestor de caso verifica que los maestros los cumplan. Desde julio de 2025, HCPSS también hace reuniones 504 en los grados 3, 6 y 9, años de transición."},
ko:{t:"504 플랜 (정책 9060)",s:"장애가 있는 학생이 동등하게 배울 수 있도록 필요한 편의를 제공하는 법적 계획입니다.",m:"504 플랜은 1973년 재활법 섹션 504에 근거합니다. 배우는 내용을 바꾸는 것이 아니라 접근 방법을 바꿔 줍니다. 신체적 또는 정신적 장애가 학습, 시각, 청각, 걷기, 호흡 같은 활동을 크게 제한하면 대상이 될 수 있습니다. 학부모, 교사, 직원이 504 회의를 요청할 수 있고, 학교 팀이 대상 여부를 결정합니다. IEP와 달리 504 플랜은 특별 교육이 아니라 접근성을 보장합니다.",e:["시험 시간 연장","교사와 가까운 자리 배정","수업 중 짧은 휴식","조정된 과제","심한 알레르기나 당뇨가 있는 학생은 교사가 도울 수 있도록 서면 계획을 갖습니다"],w:"계획은 문서로 작성되고 담당자가 교사들이 이를 지키는지 확인합니다. 2025년 7월부터 HCPSS는 전환기인 3, 6, 9학년 학생을 위한 504 회의도 엽니다."},
zh:{t:"504 计划（政策 9060）",s:"一项法律计划，为有残障的学生提供所需的合理便利，让他们能平等学习。",m:"504 计划源自 1973 年《康复法》第 504 条。它不改变你学什么，而是改变你获得学习机会的方式。如果身体或心理上的障碍严重影响学习、视力、听力、行走或呼吸等活动，你就可能符合资格。家长、老师或学校人员都可以申请 504 会议，由学校团队判断你是否符合。与 IEP 不同，504 计划提供的是平等的机会，而不是特殊教学。",e:["考试延长时间","座位靠近老师","课堂上短暂休息","调整后的作业","有严重过敏或糖尿病的学生有书面计划，老师就知道该怎么帮忙"],w:"计划会写成书面文件，并由个案负责人确认老师是否执行。自 2025 年 7 月起，HCPSS 还为处于过渡期的 3、6、9 年级学生召开 504 会议。"}}},
{k:1,u:"https://www.hcpss.org/academics/special-education/",L:{
en:{t:"Individualized Education Programs (IEPs)",s:"A legally binding plan for students who need specialized instruction because of a disability.",m:"An IEP is created under the federal law IDEA. It lists your learning goals, the services you receive and the accommodations you need. You and your family have rights in the process, and meetings are held to review your progress and update support. The difference from a 504 Plan: an IEP provides specialized instruction, while a 504 Plan provides access.",e:["A student who struggles with reading gets extra instruction from a special education teacher","The plan names who is responsible for each service","Your family joins a meeting to review progress and ask for changes"],w:"HCPSS provides special education services for eligible students from birth to age 21, and every school has a special education team leader."},
es:{t:"Programas de Educación Individualizada (IEP)",s:"Un plan legalmente vinculante para estudiantes que necesitan instrucción especializada por una discapacidad.",m:"Un IEP se crea bajo la ley federal IDEA. Enumera tus metas de aprendizaje, los servicios que recibes y los ajustes que necesitas. Tú y tu familia tienen derechos en el proceso y se hacen reuniones para revisar tu progreso y actualizar el apoyo. La diferencia con un Plan 504: el IEP ofrece instrucción especializada, mientras que el Plan 504 ofrece acceso.",e:["Un estudiante con dificultades de lectura recibe instrucción adicional de un maestro de educación especial","El plan indica quién es responsable de cada servicio","Tu familia participa en una reunión para revisar el progreso y pedir cambios"],w:"HCPSS ofrece educación especial a estudiantes elegibles desde el nacimiento hasta los 21 años, y cada escuela tiene un líder del equipo de educación especial."},
ko:{t:"개별화 교육 프로그램 (IEP)",s:"장애로 인해 특별한 교육이 필요한 학생을 위한 법적 구속력이 있는 계획입니다.",m:"IEP는 연방법 IDEA에 따라 만들어집니다. 학습 목표, 받게 될 서비스, 필요한 편의가 담겨 있습니다. 학생과 가족에게는 이 과정에서 권리가 있으며, 진행 상황을 점검하고 지원을 바꾸기 위해 회의가 열립니다. 504 플랜과의 차이: IEP는 특별 교육을, 504 플랜은 접근성을 제공합니다.",e:["읽기가 어려운 학생이 특수교육 교사에게 추가 수업을 받습니다","계획에 각 서비스 담당자가 명시됩니다","가족이 회의에 참여해 진행 상황을 확인하고 변경을 요청합니다"],w:"HCPSS는 출생부터 만 21세까지 자격이 있는 학생에게 특수교육을 제공하며, 모든 학교에 특수교육 팀 리더가 있습니다."},
zh:{t:"个别化教育计划（IEP）",s:"为因残障需要特殊教学的学生制定的具有法律约束力的计划。",m:"IEP 根据联邦法律 IDEA 制定，列出你的学习目标、将获得的服务和所需的便利。你和家人在过程中享有权利，学校会开会检查进展并更新支持。与 504 计划的区别：IEP 提供特殊教学，504 计划提供平等的学习机会。",e:["阅读有困难的学生从特殊教育老师那里获得额外辅导","计划写明每项服务由谁负责","家人参加会议，了解进展并提出调整"],w:"HCPSS 为符合条件的学生提供从出生到 21 岁的特殊教育服务，每所学校都有特殊教育团队负责人。"}}},
{c:1,u:H+"1000/1010/",L:{
en:{t:"Policy 1010: Anti-Discrimination",s:"Protects students from discrimination and harassment and gives them a safe way to report it.",m:"Discrimination means treating someone unfairly because of who they are, such as race, religion, gender, gender identity, sexual orientation, disability, age, national origin or immigration status, or socioeconomic status. It is not allowed in class, at events, or online if it affects school. You cannot be punished for reporting it. You can tell a teacher, counselor, principal or assistant principal, or the Equity Assurance Office.",e:["A student is left out of a club because of their religion, which can be reported","Mean online posts about a classmate's disability that affect school life","A student reports unfair treatment and is not punished for speaking up"],w:"After a report, the school must begin an investigation within two working days, and it is usually resolved in about thirty days. Both sides can be informed and can appeal. Consequences can include suspension or expulsion for students."},
es:{t:"Política 1010: Antidiscriminación",s:"Protege a los estudiantes de la discriminación y el acoso y les da una forma segura de denunciar.",m:"Discriminar es tratar a alguien injustamente por quién es: raza, religión, género, identidad de género, orientación sexual, discapacidad, edad, origen nacional o estatus migratorio, o nivel socioeconómico. No se permite en clase, en eventos ni en línea si afecta a la escuela. No pueden castigarte por denunciar. Puedes decírselo a un maestro, consejero, director o subdirector, o a la Oficina de Garantía de Equidad.",e:["Un estudiante queda fuera de un club por su religión, lo cual se puede denunciar","Publicaciones crueles en línea sobre la discapacidad de un compañero que afectan la vida escolar","Un estudiante denuncia un trato injusto y no es castigado por hablar"],w:"Tras una denuncia, la escuela debe iniciar una investigación en dos días hábiles y normalmente se resuelve en unos treinta días. Ambas partes pueden ser informadas y apelar. Las consecuencias pueden incluir suspensión o expulsión."},
ko:{t:"정책 1010: 차별 금지",s:"학생을 차별과 괴롭힘으로부터 보호하고 안전하게 신고할 수 있는 방법을 제공합니다.",m:"차별은 인종, 종교, 성별, 성 정체성, 성적 지향, 장애, 나이, 출신국이나 이민 신분, 사회경제적 지위 등 그 사람이 누구인지를 이유로 부당하게 대하는 것입니다. 수업, 행사, 학교생활에 영향을 주는 온라인 공간에서도 금지됩니다. 신고했다는 이유로 불이익을 받을 수 없습니다. 교사, 상담교사, 교장·교감, 형평성 보장 사무국에 알릴 수 있습니다.",e:["종교 때문에 동아리에서 배제되는 경우는 신고할 수 있습니다","친구의 장애를 조롱하는 온라인 게시물이 학교생활에 영향을 주는 경우","부당한 대우를 신고해도 불이익을 받지 않습니다"],w:"신고 후 학교는 영업일 기준 2일 이내에 조사를 시작해야 하며 보통 약 30일 안에 마무리됩니다. 양측 모두 안내를 받고 이의를 제기할 수 있습니다. 학생에게는 정학이나 퇴학 등의 조치가 있을 수 있습니다."},
zh:{t:"政策 1010：反歧视",s:"保护学生免受歧视和骚扰，并提供安全的举报渠道。",m:"歧视是指因为一个人的身份而对其不公平对待，例如种族、宗教、性别、性别认同、性取向、残障、年龄、原籍国或移民身份、社会经济地位。在课堂、活动，或影响校园生活的网络上都不允许。你不会因为举报而受到惩罚。你可以告诉老师、辅导员、校长或副校长，或公平保障办公室。",e:["学生因宗教被排除在社团之外，可以举报","网上嘲笑同学残障的帖子影响了校园生活","学生举报不公平对待，不会因为发声而受罚"],w:"举报后，学校必须在两个工作日内开始调查，通常约三十天内解决。双方都有权知情并可申诉。学生可能面临停学或开除等处分。"}}},
{c:1,u:H+"1000/1020/",x:["https://www.hcpss.org/supports/lgbtqia-youth/gender-guidelines/",{en:"HCPSS Gender-Inclusive Guidelines",es:"Guías de inclusión de género de HCPSS",ko:"HCPSS 성별 포용 지침",zh:"HCPSS 性别包容指南"}],L:{
en:{t:"Policy 1020: Sex Discrimination, Harassment and Misconduct",s:"Prohibits discrimination or harassment based on sex, sexual orientation, gender identity or gender expression.",m:"This policy covers classes, clubs, sports and workplaces. Everyone should be able to learn and take part without being harassed because of their sex, sexual orientation, gender identity or how they express their gender. It works alongside the HCPSS Gender-Inclusive Guidelines, which support transgender and nonbinary students.",e:["Unwanted comments or touching are harassment and can be reported","A student cannot be pushed out of an activity because of their gender identity","Schools follow the Gender-Inclusive Guidelines to support transgender and nonbinary students"],w:"Students have a formal way to report harassment in academics and extracurriculars, and the same protections apply to the adults who work in schools."},
es:{t:"Política 1020: Discriminación, acoso y conducta sexual indebida",s:"Prohíbe la discriminación o el acoso por sexo, orientación sexual, identidad de género o expresión de género.",m:"Esta política cubre clases, clubes, deportes y lugares de trabajo. Todos deben poder aprender y participar sin sufrir acoso por su sexo, orientación sexual, identidad de género o cómo expresan su género. Funciona junto con las Guías de inclusión de género de HCPSS, que apoyan a estudiantes transgénero y no binarios.",e:["Los comentarios o el contacto no deseados son acoso y se pueden denunciar","Nadie puede ser excluido de una actividad por su identidad de género","Las escuelas siguen las guías de inclusión de género para apoyar a estudiantes transgénero y no binarios"],w:"Los estudiantes tienen una vía formal para denunciar acoso en lo académico y en las actividades extracurriculares, y las mismas protecciones se aplican a los adultos que trabajan en las escuelas."},
ko:{t:"정책 1020: 성차별, 성희롱 및 성적 비행",s:"성별, 성적 지향, 성 정체성, 성별 표현을 이유로 한 차별이나 괴롭힘을 금지합니다.",m:"이 정책은 수업, 동아리, 운동부, 직장에 적용됩니다. 누구나 성별, 성적 지향, 성 정체성 또는 성별 표현 때문에 괴롭힘을 당하지 않고 배우고 참여할 수 있어야 합니다. 트랜스젠더와 논바이너리 학생을 지원하는 HCPSS 성별 포용 지침과 함께 운영됩니다.",e:["원치 않는 발언이나 접촉은 괴롭힘이며 신고할 수 있습니다","성 정체성을 이유로 활동에서 밀려나서는 안 됩니다","학교는 성별 포용 지침에 따라 트랜스젠더와 논바이너리 학생을 지원합니다"],w:"학생은 수업과 방과후 활동에서 괴롭힘을 공식적으로 신고할 수 있으며, 학교에서 일하는 어른에게도 같은 보호가 적용됩니다."},
zh:{t:"政策 1020：性别歧视、性骚扰与性不当行为",s:"禁止基于性别、性取向、性别认同或性别表达的歧视或骚扰。",m:"本政策适用于课堂、社团、体育活动和工作场所。每个人都应能在不因性别、性取向、性别认同或性别表达而被骚扰的情况下学习和参与。它与 HCPSS 性别包容指南一起实施，该指南支持跨性别和非二元性别学生。",e:["不受欢迎的言语或触碰属于骚扰，可以举报","不能因为性别认同而被排挤出活动","学校依照性别包容指南支持跨性别和非二元性别学生"],w:"学生在学业和课外活动中都有正式的举报渠道，在学校工作的成年人也受到同样的保护。"}}},
{c:1,u:H+"1000/1070/",L:{
en:{t:"Policy 1070: Protections and Supports for Foreign-Born Students and Families",s:"Makes sure students feel safe and welcome no matter where they were born or their immigration status.",m:"Every student has the right to go to school regardless of where they were born or their immigration status. Schools cannot ask about immigration status except in rare cases like exchange programs, must provide language access and translation for families, and school property is a safe zone where immigration enforcement is limited unless required by law. Bullying or harassment of students who are, or seem to be, foreign-born is not allowed.",e:["A family receives school information translated into the language they speak","A school does not ask for immigration papers to enroll a student","A newly arrived student gets language support and help adjusting to a new school"],w:"Under US law, children have a right to a public education regardless of immigration status. Policies like this help families feel safe sending their children to school."},
es:{t:"Política 1070: Protecciones y apoyos para estudiantes y familias nacidos en el extranjero",s:"Garantiza que los estudiantes se sientan seguros y bienvenidos sin importar dónde nacieron o su estatus migratorio.",m:"Todo estudiante tiene derecho a ir a la escuela sin importar dónde nació o su estatus migratorio. Las escuelas no pueden preguntar por el estatus migratorio salvo en casos raros como programas de intercambio, deben ofrecer acceso a idiomas y traducción a las familias, y la propiedad escolar es una zona segura donde la acción migratoria está limitada salvo que la ley lo exija. No se permite el acoso a estudiantes nacidos en el extranjero o que lo parezcan.",e:["Una familia recibe la información escolar traducida a su idioma","Una escuela no pide documentos migratorios para inscribir a un estudiante","Un estudiante recién llegado recibe apoyo de idioma y ayuda para adaptarse"],w:"Según la ley de EE. UU., los niños tienen derecho a la educación pública sin importar su estatus migratorio. Políticas como esta ayudan a que las familias se sientan seguras al enviar a sus hijos a la escuela."},
ko:{t:"정책 1070: 외국 출생 학생 및 가족 보호와 지원",s:"출생지나 이민 신분과 관계없이 학생이 안전하고 환영받는다고 느끼도록 보장합니다.",m:"모든 학생은 출생지나 이민 신분과 관계없이 학교에 다닐 권리가 있습니다. 학교는 교환학생 프로그램 같은 드문 경우를 제외하고 이민 신분을 물을 수 없고, 가족을 위한 언어 지원과 통역·번역을 제공해야 하며, 학교 부지는 법이 요구하지 않는 한 이민 단속이 제한되는 안전 구역입니다. 외국 출생이거나 그렇게 보이는 학생을 괴롭히는 것은 허용되지 않습니다.",e:["가족이 사용하는 언어로 번역된 학교 안내를 받습니다","학교는 입학을 위해 이민 서류를 요구하지 않습니다","새로 온 학생이 언어 지원과 적응 도움을 받습니다"],w:"미국 법에 따라 아동은 이민 신분과 관계없이 공교육을 받을 권리가 있습니다. 이런 정책은 가족이 안심하고 자녀를 학교에 보내도록 돕습니다."},
zh:{t:"政策 1070：对外国出生学生及家庭的保护与支持",s:"无论出生地或移民身份，都确保学生在学校感到安全并受到欢迎。",m:"每位学生无论出生在哪里、移民身份如何，都有权上学。除交换项目等少数情况外，学校不能询问移民身份，必须为家庭提供语言协助和翻译，学校场所是安全区，除非法律要求，否则限制移民执法。禁止欺凌或骚扰外国出生或被认为是外国出生的学生。",e:["家庭收到翻译成自己语言的学校信息","学校不会为了注册而要求出示移民文件","新来的学生获得语言支持和适应新学校的帮助"],w:"根据美国法律，儿童无论移民身份如何都有接受公立教育的权利。这类政策让家庭更放心送孩子上学。"}}},
{u:H+"1000/1080/",L:{
en:{t:"Policy 1080: Educational Equity (including Access to Advanced Courses)",s:"Gives each student the support they need to succeed and keeps advanced classes (Honors, GT, AP, Dual Enrollment) fair and open.",m:"Equality gives everyone the same thing. Equity gives each student what they need. The policy recognizes that race, ability, language and background can affect access, and it works to remove barriers, close achievement gaps and promote fairness and equal opportunity. This includes advanced classes: placement in Honors, GT, AP and Dual Enrollment should be fair and accessible, schools work to remove barriers and gatekeeping, and you can advocate for yourself. These classes help with college readiness and future opportunities.",e:["Two students need glasses: equality hands both the same pair, equity gives each the right prescription","School information is available in multiple languages","Students who need tutoring or language support can get it","Ask your counselor which Honors, GT, AP or Dual Enrollment options fit you","Question a prerequisite that keeps an interested student out"],w:"Research the committee studied found that students in low-poverty schools are nearly twice as likely to take 8th-grade Algebra as students in high-poverty schools, and that students in schools with fewer students of color are 1.5 times more likely to be in advanced math. These gaps grew during the pandemic, when AP, IB and dual-credit classes were overhauled or canceled."},
es:{t:"Política 1080: Equidad educativa (incluye el acceso a cursos avanzados)",s:"Da a cada estudiante el apoyo que necesita y mantiene las clases avanzadas (Honors, GT, AP, Inscripción Dual) justas y abiertas.",m:"La igualdad da a todos lo mismo. La equidad da a cada estudiante lo que necesita. La política reconoce que la raza, la capacidad, el idioma y el origen pueden afectar el acceso, y trabaja para eliminar barreras, cerrar brechas de rendimiento y promover justicia e igualdad de oportunidades. Incluye las clases avanzadas: la colocación en Honors, GT, AP e Inscripción Dual debe ser justa y accesible, las escuelas trabajan para eliminar barreras y exclusiones, y tú puedes abogar por ti mismo. Estas clases ayudan a prepararte para la universidad y para tu futuro.",e:["Dos estudiantes necesitan lentes: la igualdad da a ambos el mismo par, la equidad da a cada uno la graduación correcta","La información escolar está disponible en varios idiomas","Los estudiantes que lo necesitan reciben tutoría o apoyo de idioma","Pregunta a tu consejero qué opciones de Honors, GT, AP o Inscripción Dual te convienen","Cuestiona un prerrequisito que deja fuera a un estudiante interesado"],w:"La investigación del comité encontró que los estudiantes de escuelas de baja pobreza tienen casi el doble de probabilidad de cursar Álgebra en 8.º grado que los de escuelas de alta pobreza, y que en escuelas con menos estudiantes de color es 1.5 veces más probable estar en matemáticas avanzadas. Estas brechas crecieron durante la pandemia, cuando las clases AP, IB y de crédito dual fueron modificadas o canceladas."},
ko:{t:"정책 1080: 교육 형평성 (심화 과정 접근성 포함)",s:"각 학생에게 필요한 지원을 제공하고 심화 수업(Honors, GT, AP, 이중 등록)이 공정하고 열려 있도록 합니다.",m:"평등은 모두에게 같은 것을 주는 것이고, 형평성은 각 학생에게 필요한 것을 주는 것입니다. 이 정책은 인종, 능력, 언어, 배경이 교육 접근성에 영향을 줄 수 있음을 인정하고, 장벽을 없애고 성취 격차를 줄이며 공정과 기회 균등을 높이려 합니다. 심화 수업도 포함됩니다. Honors, GT, AP, 이중 등록 배정은 공정하고 접근 가능해야 하며, 학교는 장벽과 진입 제한을 없애려 노력하고, 학생은 스스로 요청할 수 있습니다. 이런 수업은 대학 준비와 미래 기회에 도움이 됩니다.",e:["안경이 필요한 두 학생에게 평등은 같은 안경을, 형평성은 각자에게 맞는 안경을 줍니다","학교 정보가 여러 언어로 제공됩니다","필요한 학생은 튜터링이나 언어 지원을 받을 수 있습니다","상담교사에게 나에게 맞는 Honors, GT, AP, 이중 등록 과목을 물어보세요","관심 있는 학생을 막는 선수 조건에 대해 질문하세요"],w:"위원회가 살펴본 연구에 따르면 저빈곤 학교 학생은 고빈곤 학교 학생보다 8학년 대수학을 수강할 가능성이 거의 두 배이고, 유색인종 학생이 적은 학교 학생은 심화 수학에 등록할 가능성이 1.5배 높습니다. 이 격차는 팬데믹 때 AP, IB, 이중 학점 수업이 개편되거나 취소되면서 더 커졌습니다."},
zh:{t:"政策 1080：教育公平（含高阶课程机会）",s:"给每位学生成功所需的支持，并让高阶课程（荣誉班、GT、AP、双重注册）公平开放。",m:"平等是给每个人一样的东西，公平是给每位学生他们需要的东西。本政策承认种族、能力、语言和背景会影响学生获得教育的机会，并致力于消除障碍、缩小成绩差距，促进公平和机会均等。这也包括高阶课程：荣誉班、GT、AP 和双重注册的安排应公平且可获得，学校要努力消除障碍和门槛，你也可以为自己争取。这些课程有助于为大学和未来做准备。",e:["两位学生都需要眼镜：平等是给两人同样的眼镜，公平是给各自合适的度数","学校信息提供多种语言版本","需要辅导或语言支持的学生可以获得帮助","问问辅导员，哪些荣誉班、GT、AP 或双重注册课程适合你","对阻碍有兴趣学生的先修要求提出疑问"],w:"委员会研究发现，低贫困率学校的学生修读八年级代数的可能性几乎是高贫困率学校学生的两倍，有色人种学生较少的学校，学生修读高阶数学的可能性是其他学校的 1.5 倍。疫情期间 AP、IB 和双学分课程被大幅调整或取消，这些差距进一步扩大。"}}},
{c:1,u:H+"9000/9460/",L:{
en:{t:"Policy 9460: Bullying, Cyberbullying, Harassment and Intimidation",s:"Bans bullying and hate or bias incidents, including demeaning symbols, at school and school events.",m:"This policy was formerly Policy 1060. It covers bullying, cyberbullying, harassment and intimidation involving students, and it specifically bans hate or bias incidents and displaying demeaning symbols such as swastikas and Confederate flags on school property or at school-sponsored events. Harassment by employees is covered separately under Policy 7140.",e:["Group chat posts mocking a classmate count as cyberbullying","Drawing a swastika on a desk is a hate incident the school must address","Threats or intimidation at a school-sponsored event are covered"],w:"Hate symbols hurt whole communities, not just one student. Naming them in policy lets schools act clearly instead of guessing."},
es:{t:"Política 9460: Acoso escolar, ciberacoso, hostigamiento e intimidación",s:"Prohíbe el acoso y los incidentes de odio o sesgo, incluidos símbolos degradantes, en la escuela y sus eventos.",m:"Esta política antes era la Política 1060. Cubre el acoso escolar, el ciberacoso, el hostigamiento y la intimidación entre estudiantes, y prohíbe específicamente los incidentes de odio o sesgo y mostrar símbolos degradantes como esvásticas y banderas confederadas en propiedad escolar o en eventos patrocinados por la escuela. El acoso por parte de empleados se cubre en la Política 7140.",e:["Mensajes en un chat grupal que se burlan de un compañero cuentan como ciberacoso","Dibujar una esvástica en un pupitre es un incidente de odio que la escuela debe atender","Las amenazas o la intimidación en un evento escolar están cubiertas"],w:"Los símbolos de odio dañan a comunidades enteras, no solo a un estudiante. Nombrarlos en la política permite a las escuelas actuar con claridad."},
ko:{t:"정책 9460: 따돌림, 사이버 따돌림, 괴롭힘 및 위협",s:"학교와 학교 행사에서 따돌림과 혐오·편견 사건, 모욕적인 상징물을 금지합니다.",m:"이 정책은 예전에 정책 1060이었습니다. 학생 사이의 따돌림, 사이버 따돌림, 괴롭힘, 위협을 다루며, 학교 부지나 학교 후원 행사에서 혐오·편견 사건과 나치 문양, 남부연합기 같은 모욕적인 상징물 표시를 구체적으로 금지합니다. 교직원의 괴롭힘은 정책 7140에서 따로 다룹니다.",e:["단체 채팅방에서 친구를 조롱하는 글은 사이버 따돌림입니다","책상에 나치 문양을 그리는 것은 학교가 대응해야 하는 혐오 사건입니다","학교 후원 행사에서의 위협도 포함됩니다"],w:"혐오 상징은 한 학생뿐 아니라 공동체 전체에 상처를 줍니다. 정책에 명시하면 학교가 명확하게 대응할 수 있습니다."},
zh:{t:"政策 9460：欺凌、网络欺凌、骚扰与恐吓",s:"禁止在学校及学校活动中的欺凌、仇恨或偏见事件，包括侮辱性符号。",m:"本政策前身是政策 1060。它涵盖学生之间的欺凌、网络欺凌、骚扰和恐吓，并明确禁止仇恨或偏见事件，以及在学校场所或学校主办的活动中展示卐字符、邦联旗等侮辱性符号。员工骚扰由政策 7140 另行规定。",e:["群聊里嘲笑同学的信息属于网络欺凌","在课桌上画卐字符是学校必须处理的仇恨事件","学校主办活动中的威胁或恐吓也在范围内"],w:"仇恨符号伤害的是整个群体，而不只是一位学生。把它们写进政策，学校才能明确地采取行动。"}}},
{u:H+"1000/1040/",L:{
en:{t:"Policy 1040: Safe and Supportive Schools (including Student Mental Health Supports)",s:"Builds a school climate that is emotionally safe and inclusive, with counseling and wellness services for students.",m:"Safety is not only locks and cameras. This policy says schools should feel emotionally safe and welcoming while also protecting students from physical threats. Mental health support is part of that. Schools provide counseling and wellness services, and confidentiality is protected. You can ask a trusted adult for help for yourself or a friend you are worried about. If you need ongoing help, School Based Mental Health Services offer therapy during the school day: a Student Support Team reviews your situation, a parent or guardian gives permission, a mental health professional does an assessment, and support begins. In an urgent situation, go to a trusted adult at school, call emergency services or contact a crisis line.",e:["Talk to your school counselor, who is in every school","Tell a teacher you are worried about a friend and ask for a referral","A parent or guardian contacts the school to request support","A staff member checks in with a student who seems withdrawn"],w:"Because therapy happens during the school day, students can get help without missing school or needing a ride after hours. Students who feel safe and included can focus on learning, which is why school climate is treated as part of safety."},
es:{t:"Política 1040: Escuelas seguras y de apoyo (incluye apoyos de salud mental)",s:"Crea un clima escolar emocionalmente seguro e inclusivo, con servicios de consejería y bienestar para los estudiantes.",m:"La seguridad no son solo cerraduras y cámaras. Esta política dice que las escuelas deben sentirse emocionalmente seguras y acogedoras, y a la vez proteger a los estudiantes de amenazas físicas. El apoyo de salud mental es parte de esto. Las escuelas ofrecen consejería y servicios de bienestar, y la confidencialidad está protegida. Puedes pedir ayuda a un adulto de confianza para ti o para un amigo que te preocupa. Si necesitas ayuda continua, los Servicios de Salud Mental en la Escuela ofrecen terapia durante el día escolar: un Equipo de Apoyo Estudiantil revisa tu situación, un padre o tutor da permiso, un profesional de salud mental hace una evaluación y comienza el apoyo. En una urgencia, acude a un adulto de confianza, llama a emergencias o contacta una línea de crisis.",e:["Habla con tu consejero escolar, que está en todas las escuelas","Dile a un maestro que te preocupa un amigo y pide una derivación","Un padre o tutor contacta a la escuela para solicitar apoyo","Un miembro del personal habla con un estudiante que parece retraído"],w:"Como la terapia ocurre durante el día escolar, los estudiantes reciben ayuda sin faltar a clases ni necesitar transporte después del horario. Los estudiantes que se sienten seguros e incluidos pueden concentrarse en aprender, por eso el clima escolar se considera parte de la seguridad."},
ko:{t:"정책 1040: 안전하고 지지적인 학교 (학생 정신건강 지원 포함)",s:"정서적으로 안전하고 포용적인 학교 분위기를 만들고, 학생에게 상담 및 웰니스 서비스를 제공합니다.",m:"안전은 자물쇠와 카메라만이 아닙니다. 이 정책은 학교가 정서적으로 안전하고 따뜻하게 느껴져야 하며, 동시에 신체적 위협으로부터 학생을 보호해야 한다고 말합니다. 정신건강 지원도 그 일부입니다. 학교는 상담과 웰니스 서비스를 제공하며 비밀은 보호됩니다. 나 자신이나 걱정되는 친구를 위해 믿을 수 있는 어른에게 도움을 요청할 수 있습니다. 지속적인 도움이 필요하면 학교 기반 정신건강 서비스에서 수업 시간 중에 치료를 받을 수 있습니다. 학생지원팀이 상황을 검토하고, 보호자가 동의하고, 정신건강 전문가가 평가한 뒤 지원이 시작됩니다. 긴급한 상황에서는 학교의 믿을 수 있는 어른에게 가거나 응급 서비스, 위기 상담 전화에 연락하세요.",e:["모든 학교에 있는 상담교사와 이야기해 보세요","친구가 걱정된다고 교사에게 말하고 연계를 요청하세요","보호자가 학교에 지원을 요청합니다","교직원이 위축되어 보이는 학생에게 먼저 말을 건넵니다"],w:"치료가 수업 시간에 이루어지므로 수업을 빠지거나 방과후 이동 수단 없이도 도움을 받을 수 있습니다. 안전하고 포용받는다고 느끼는 학생은 배움에 집중할 수 있기 때문에 학교 분위기를 안전의 일부로 봅니다."},
zh:{t:"政策 1040：安全且支持性的学校（含学生心理健康支持）",s:"营造情感上安全、包容的校园氛围，并为学生提供辅导和健康服务。",m:"安全不只是门锁和监控。本政策要求学校让人在情感上感到安全、受欢迎，同时保护学生免受人身威胁。心理健康支持也是其中一部分。学校提供辅导和健康服务，并保护隐私。你可以为自己或担心的朋友向信任的成年人求助。如果需要持续帮助，校内心理健康服务会在上课时间提供治疗：学生支持小组了解你的情况，家长或监护人同意，心理健康专业人员进行评估，然后开始支持。遇到紧急情况，请找学校里信任的成年人、拨打紧急电话或联系危机热线。",e:["找每所学校都有的学校辅导员谈谈","告诉老师你担心朋友，并请他们转介","家长或监护人联系学校申请支持","老师主动关心看起来很沉默的学生"],w:"因为治疗在上课时间进行，学生不用缺课，也不需要课后另找交通工具。感到安全、被接纳的学生才能专心学习，所以校园氛围被视为安全的一部分。"}}}
];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang="en",view="c",last=null;
const lc={en:"en",es:"es",ko:"ko",zh:"zh-Hans"};
function setLang(l){lang=l;document.documentElement.lang=lc[l];const t=U[l];
$("#langs").innerHTML=Object.keys(U).map(k=>`<button role="tab" aria-selected="${k===l}" data-l="${k}" lang="${lc[k]}">${U[k].nm}</button>`).join("");
$("#links").innerHTML=`<a href="#tracker">${t.nav[1]}</a><a class="cta" href="#feedback">${t.nav[2]}</a>`;
$("#h1").textContent=t.h1;$("#note").textContent=t.ab;$("#note2").textContent=t.ab;$("#sub").textContent=t.sub;$("#jump").textContent=t.jump;
$("#stats").innerHTML=[P.length,Object.keys(U).length].map((n,i)=>`<div class="stat"><b>${n}</b><span>${t.st[i*2]}</span></div>`).join("");
$("#trH").textContent=t.tH;$("#trP").textContent=t.tP;$("#q").placeholder=t.ph;$("#q").setAttribute("aria-label",t.ph);
$("#vC").textContent=t.cards;$("#vT").textContent=t.table;$("#empty").textContent=t.none;
$("#th").innerHTML=`<tr>${t.cols.map(c=>`<th>${c}</th>`).join("")}</tr>`;
$("#fH").textContent=t.cn;$("#fbH").textContent=t.fH;$("#fbP").textContent=t.fP;$("#fbB").textContent=t.fB;$("#attr").textContent=t.at;$("#close").setAttribute("aria-label",t.cl);
document.title="hcscePolicyTracking";render();}
function render(){const t=U[lang],q=$("#q").value.trim().toLowerCase();
const list=P.map((p,i)=>({p,i})).filter(({p})=>(!q||(p.L[lang].t+p.L[lang].s+p.L[lang].m+p.L[lang].e.join(" ")+p.L[lang].w).toLowerCase().includes(q)));
$("#count").textContent=t.cnt(list.length,P.length);$("#empty").classList.toggle("hidden",list.length>0);
$("#grid").classList.toggle("hidden",view!=="c"||!list.length);$("#tw").classList.toggle("hidden",view!=="t"||!list.length);
const tg=p=>`<span class="badge">${p.k?t.tg[1]:t.tg[0]}</span>`;
$("#grid").innerHTML=list.map(({p,i})=>`<article class="card"><div class="top">${tg(p)}</div><h3>${esc(p.L[lang].t)}</h3><p>${esc(p.L[lang].s)}</p><button class="btn line" data-i="${i}">${t.det}</button></article>`).join("");
$("#tb").innerHTML=list.map(({p,i})=>`<tr><td><b>${esc(p.L[lang].t)}</b><br>${tg(p)}</td><td>${esc(p.L[lang].s)}</td><td><button class="btn line" data-i="${i}">${t.det}</button></td></tr>`).join("");}
function openM(i,btn){const p=P[i],d=p.L[lang],t=U[lang];last=btn;
$("#mt").textContent=d.t;
$("#mb").innerHTML=`<span class="badge">${p.k?t.tg[1]:t.tg[0]}</span><h3>${t.plain}</h3><p>${esc(d.m)}</p><h3>${t.ex}</h3><ul>${d.e.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h3>${t.rw}</h3><p class="rw">${esc(d.w)}</p><p style="margin-top:22px"><a class="btn blue" href="${p.u}" target="_blank" rel="noopener">${t.off}</a>${p.x?` <a class="btn line" href="${p.x[0]}" target="_blank" rel="noopener">${esc(p.x[1][lang])}</a>`:""}</p>`;
$("#modal").classList.remove("hidden");document.body.style.overflow="hidden";$("#close").focus();}
function shut(){$("#modal").classList.add("hidden");document.body.style.overflow="";if(last)last.focus();}
document.addEventListener("click",e=>{const l=e.target.closest("[data-l]");if(l)setLang(l.dataset.l);
const d=e.target.closest("[data-i]");if(d)openM(+d.dataset.i,d);
if(e.target===$("#modal"))shut();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").classList.contains("hidden"))shut();});
$("#close").onclick=shut;$("#q").oninput=render;
$("#vC").onclick=()=>{view="c";$("#vC").setAttribute("aria-pressed",true);$("#vT").setAttribute("aria-pressed",false);render();};
$("#vT").onclick=()=>{view="t";$("#vT").setAttribute("aria-pressed",true);$("#vC").setAttribute("aria-pressed",false);render();};
setLang("en");
</script>
</body>
</html>
